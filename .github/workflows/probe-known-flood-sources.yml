name: Probe known flood sources

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_known_flood_sources.py'
      - 'scripts/summarize_probe.py'
      - '.github/workflows/probe-known-flood-sources.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe known sources
        run: python scripts/probe_known_flood_sources.py
      - name: Build concise probe summary
        run: python scripts/summarize_probe.py
      - name: Commit probe result
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain data/discovery)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/discovery/known_sources_probe.json data/discovery/known_sources_summary.json
            git commit -m "Record known flood source probe"
            git pull --rebase
            git push
          fi
