name: Search ArcGIS Online flood sources

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/search_arcgis_online.py'
      - '.github/workflows/search-arcgis-online.yml'

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Search ArcGIS Online
        run: python scripts/search_arcgis_online.py
      - name: Commit search results
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain data/discovery/arcgis_online_search.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/discovery/arcgis_online_search.json
            git commit -m "Record ArcGIS Online flood source search"
            git pull --rebase
            git push
          fi
