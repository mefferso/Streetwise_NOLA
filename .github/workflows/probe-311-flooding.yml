name: Probe 311 flood records

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_311_flooding.py'
      - '.github/workflows/probe-311-flooding.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe 311 flood-related requests
        run: python scripts/probe_311_flooding.py
      - name: Commit probe result
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain data/discovery/311_flood_probe.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/discovery/311_flood_probe.json
            git commit -m "Record 311 flood-gap probe"
            git pull --rebase
            git push
          fi
