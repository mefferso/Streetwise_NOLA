name: Temporary targeted ArcGIS forensic probe

on:
  push:
    branches:
      - forensic-july12-recovery-20260911
    paths:
      - scripts/forensic_targeted_probe.py
      - .github/workflows/forensic-targeted-probe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: streetwise-forensic-targeted-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run targeted read-only public data probe
        run: python scripts/forensic_targeted_probe.py
      - name: Commit diagnostic evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forensics/targeted_probe.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record targeted ArcGIS forensic results"
          git push
