name: Backfill flood history

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/backfill_history.py'
      - '.github/workflows/backfill-history.yml'

permissions:
  contents: write

concurrency:
  group: streetwise-flood-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backfill historic flood incidents
        shell: bash
        run: |
          python - <<'PY'
          import runpy
          import ssl
          ssl._create_default_https_context = ssl._create_unverified_context
          runpy.run_path('scripts/backfill_history.py', run_name='__main__')
          PY

      - name: Commit recovered archive data
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Backfill missed Streetwise flood incidents"
            git pull --rebase
            git push
          else
            echo "No historical archive changes to commit."
          fi
