name: Inspect live Streetwise endpoints

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/inspect_live_streetwise.py'
      - '.github/workflows/inspect-live-streetwise.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect live Streetwise
        run: python scripts/inspect_live_streetwise.py
      - name: Commit inspection
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain data/discovery/live_streetwise_inspection.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/discovery/live_streetwise_inspection.json
            git commit -m "Record live Streetwise endpoint inspection"
            git pull --rebase
            git push
          fi
